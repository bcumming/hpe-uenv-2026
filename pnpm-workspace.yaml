allowBuilds:
  esbuild: true
  playwright-chromium: true

overrides:
  # fuse.js@7.3.0+ changed search('') to return all items instead of none,
  # which makes Slidev's Goto dialog leak its full slide list even when closed
  # (slidevjs/slidev#2519, #2522). Pin to the last version before that change.
  fuse.js: 7.2.0
